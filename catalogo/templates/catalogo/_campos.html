{% if form.non_field_errors %}
  <div class="alert alert-danger rounded-0 border-0">{{ form.non_field_errors }}</div>
{% endif %}
<div class="row g-4">
  {% for field in form %}
    <div class="col-md-{% if field.name == 'descripcion' %}12{% else %}6{% endif %}">
      {% if field.field.widget.input_type == 'checkbox' %}
        <div class="form-check mt-4 border p-3 bg-light">
          {{ field }} <label class="form-check-label ms-2 fw-bold" for="{{ field.id_for_label }}">{{ field.label }}</label>
        </div>
      {% else %}
        <label class="form-label text-muted small fw-bold text-uppercase" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      {% endif %}
      {% for e in field.errors %}<div class="text-danger small mt-1 fw-bold">{{ e }}</div>{% endfor %}
    </div>
  {% endfor %}
</div>
