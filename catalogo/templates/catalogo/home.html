{% extends 'catalogo/base.html' %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4 fw-bold mb-3">Encuentra tu lugar ideal</h1>
  <p class="text-muted mb-5 fs-5">Descubre propiedades exclusivas seleccionadas para ti.</p>
  
  <div class="d-flex justify-content-center gap-3 flex-wrap">
    <a class="btn btn-accent btn-lg px-5 py-3" href="{% url 'catalogo:lista' %}">Explorar Propiedades</a>
    {% if user.is_authenticated %}
    <a class="btn btn-outline-accent btn-lg px-5 py-3" href="{% url 'catalogo:crear' %}">Publicar Inmueble</a>
    {% endif %}
  </div>
</div>
{% endblock %}
